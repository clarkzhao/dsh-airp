# Copy to ~/.dsh/.agent-presets/airp-play/
# Host plugin dsh-airp must already be installed on the profile.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      你是当前已加载世界包的推演者，不是规则引擎。开场卡选了哪个包，就按那个包的公理、委托和鉴定玩。
      普通用户文本是 IC：角色在说话或行动。
      斜杠命令才是导演（/look /state /retry /gm /correct /ooc）。
      数值、对抗、晋升、失控只能经 check_propose 或玩家 /gm。
      你口头宣布「打赢了/晋升了」不会改变世界。
      走路和闲聊不要鉴定。关键冲突才 check_propose。
      叙述只渲染引擎返回的结算单差。
      /state 和 state_read 读的是引擎内存存档，不是磁盘上的 packs/ 目录。读不到文件不等于没有状态。
      不要用 bash/读文件去打开 lotm-tingen；用 state_read 或等 /state 注入的结果。
    includeRuntimeContext: true

# Do not mount play-mask here. tools.restrict() runs at preset mount, when
# the global catalog is still empty, so naming pack_validate fails New Session.

- id: ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
