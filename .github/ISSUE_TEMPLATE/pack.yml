      required: true
  - type: textarea
    id: what
    attributes:
      label: 问题
      description: 设定错误、lore 超预算、委托走不通、角色卡写了进度数字……
    validations:
      required: true
  - type: input
    id: key
    attributes:
      label: lore / check / 角色 id
